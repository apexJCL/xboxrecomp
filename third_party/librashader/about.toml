# cargo-about config for build-windows.sh: the licences of every crate
# linked into the x86-64 Windows librashader.dll (see THIRDPARTY.txt in the
# zip). Build and dev dependencies are not linked.
accepted = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "Zlib", "Unlicense", "0BSD", "CC0-1.0", "MIT-0",
    "MPL-2.0", "Unicode-3.0",
]
targets = ["x86_64-pc-windows-gnullvm"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
